services:
  engine:
    # Published by .github/workflows/release.yml as ghcr.io/0xdabiaoge/origin-quant:v1.0.x
    # Server:  docker compose pull && docker compose up -d
    # Local:   OQ_IMAGE_TAG=dev docker compose build   (or just `docker compose build`)
    image: ghcr.io/0xdabiaoge/origin-quant:${OQ_IMAGE_TAG:-latest}
    build: .
    container_name: origin-quant
    restart: unless-stopped
    env_file:
      # `raw` stops Compose from interpolating `$`. Without it an argon2 hash in
      # OQ_ADMIN_PASSWORD_HASH is silently mangled ($argon2id$v=19 -> =19) and
      # every login fails with a perfectly valid password.
      - path: .env
        format: raw
    environment:
      OQ_CONFIG_DIR: /app/config
      OQ_DB_PATH: /app/data/origin.db
      OQ_DATA_DIR: /app/data
    ports:
      # Bind to loopback only. Put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:8000:8000"
    volumes:
      - oq-data:/app/data
      # The rootfs is read-only, so anything the console writes needs a mount.
      # Backups and logs are the only two write targets the UI exposes.
      - oq-backups:/app/backups
      - oq-logs:/app/logs
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  oq-data:
  oq-backups:
  oq-logs:
