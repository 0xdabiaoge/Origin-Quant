name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The SPA must build and typecheck before any Python job trusts it: the
  # Dockerfile copies its output into the image.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: web
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/oq/app/web
          retention-days: 7

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      # Tests assert the SPA shell is served, so the build must exist.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: src/oq/app/web

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Smoke the CLI end to end
        run: |
          oq init-db
          oq verify
          oq seed --source synthetic --days 20
          oq backtest --source okx --days 20 --cash 10000

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: origin-quant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
