name: release

# Publishes ghcr.io/<owner>/origin-quant:<version> on every green build of main,
# so a server can simply `docker compose pull && docker compose up -d`.
#
# The version is derived from the number of existing v1.* tags, not from a
# state file: tags are auditable and cannot drift from what actually shipped.
#
#   tags so far: 0    -> 1.0.0
#   tags so far: 1    -> 1.0.1
#   tags so far: 99   -> 1.0.99
#   tags so far: 100  -> 1.1.0    (patch rolls over at 99)

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release tag
  packages: write # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/0xdabiaoge/origin-quant

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only ship code that passed the test matrix.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Derive the next version from the tag count
        id: ver
        run: |
          set -euo pipefail
          n=$(git tag -l 'v1.*' | wc -l | tr -d ' ')
          minor=$(( n / 100 ))
          patch=$(( n % 100 ))
          version="1.${minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "existing tags: ${n} -> next release: v${version}"

      - name: Fail early if the tag already exists
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "::error::tag ${{ steps.ver.outputs.tag }} already exists; refusing to overwrite"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 and arm64 so the same image runs on a cheap x86 box or an ARM VPS.
          platforms: linux/amd64,linux/arm64
          build-args: |
            OQ_VERSION=${{ steps.ver.outputs.version }}
            OQ_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Tag the commit that produced this image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" \
            -m "release ${{ steps.ver.outputs.version }}"
          git push origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Released \`${{ steps.ver.outputs.tag }}\`"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}"
            echo "${{ env.IMAGE }}:latest"
            echo '```'
            echo
            echo "Pull on the server:"
            echo
            echo '```bash'
            echo "OQ_IMAGE_TAG=${{ steps.ver.outputs.tag }} docker compose pull"
            echo "OQ_IMAGE_TAG=${{ steps.ver.outputs.tag }} docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
